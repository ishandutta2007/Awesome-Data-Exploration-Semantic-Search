<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Placed strictly in background) -->
  <g id="dynamic-ambient-nodes">
    <!-- Animated Glowing Orb 1 -->
    <circle cx="150" cy="100" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
      <animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Glowing Orb 2 -->
    <circle cx="1050" cy="300" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow)">
      <animate attributeName="cx" values="1030;1070;1030" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Ambient Floating Vector Waves / Nodes -->
    <!-- Vector Link Lines -->
    <path d="M 80 340 Q 220 280 380 350 T 700 320 T 1000 370 T 1140 310" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35">
      <animate attributeName="stroke-dashoffset" values="0;48" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 60 290 Q 280 380 500 290 T 920 330 T 1150 270" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.25">
      <animate attributeName="stroke-dashoffset" values="48;0" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Floating Dynamic Network Nodes with pulsation -->
    <g transform="translate(100, 310)">
      <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#subtleGlow)">
        <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="8;20;8" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite" />
      </circle>
    </g>

    <g transform="translate(1100, 110)">
      <circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#subtleGlow)">
        <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="8;20;8" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <g transform="translate(980, 220)">
      <circle cx="0" cy="0" r="4" fill="#818cf8" filter="url(#subtleGlow)">
        <animate attributeName="r" values="3;6;3" dur="3.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <g transform="translate(180, 190)">
      <circle cx="0" cy="0" r="4" fill="#06b6d4" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Feature Pills (Solidly in foreground) -->
  <g id="foreground-content">
    <!-- Top Category Pill Badge -->
    <g transform="translate(435, 45)">
      <rect width="330" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="20" cy="17" r="4" fill="#38bdf8">
        <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="22" class="node-text" fill="#38bdf8">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="title" fill="url(#primaryGrad)" filter="url(#subtleGlow)">
      Awesome Data Exploration
    </text>
    <text x="600" y="210" text-anchor="middle" class="title" fill="#ffffff">
      &amp; Semantic Search
    </text>

    <!-- Subtitle -->
    <text x="600" y="260" text-anchor="middle" class="subtitle">
      Vector Databases • Hybrid Retrieval • Neural Search Engines • Open-Source AI Infrastructure
    </text>

    <!-- Bottom Feature Pills in Foreground -->
    <g transform="translate(200, 310)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#38bdf8" />
        <text x="42" y="26" class="pill-text">Hybrid Retrieval</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(205, 0)">
        <rect width="185" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#818cf8" />
        <text x="42" y="26" class="pill-text">Vector Databases</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(415, 0)">
        <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#c084fc" />
        <text x="42" y="26" class="pill-text">RAG &amp; GenAI Stack</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(620, 0)">
        <rect width="180" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
        <circle cx="24" cy="21" r="5" fill="#34d399" />
        <text x="42" y="26" class="pill-text">Self-Hosted OSS</text>
      </g>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
